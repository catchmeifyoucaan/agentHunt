version: '3.8'

# Production Docker Compose for Digital Ocean Droplet
# Uses: DO Managed PostgreSQL + Local Redis + DO Spaces

services:
  # Redis (local on droplet)
  redis:
    image: redis:7-alpine
    container_name: agenthunt-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: agenthunt-api
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Worker processes (4 instances)
  workers:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    command: node dist/workers.js
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 4

volumes:
  redis_data:
