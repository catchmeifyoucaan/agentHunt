# Redis configuration for AgentHunt - No Authentication
# This config disables password authentication for local development

port 6379
bind 127.0.0.1
daemonize yes

# Disable password authentication
requirepass ""
protected-mode no

# Persistence
save ""
appendonly no

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Working directory
dir /var/lib/redis

# Max memory
maxmemory 256mb
maxmemory-policy allkeys-lru
